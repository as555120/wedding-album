<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世郡 & 禾昀的婚紗相簿</title>
    <style>
        /* 基礎設定 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            background-color: #fafafa; 
            color: #333; 
            position: relative;
        }

        /* --------------------------
           柔和光暈背景裝飾 (固定在最底層)
           -------------------------- */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3; 
            z-index: -1; 
            pointer-events: none; 
        }
        .dec-1 {
            width: 40vw; height: 40vw; background-color: #f4a261; 
            top: -10vh; left: -10vw;
        }
        .dec-2 {
            width: 50vw; height: 50vw; background-color: #a8dadc; 
            bottom: -15vh; right: -10vw;
        }

        /* --------------------------
           首頁慶祝動畫區塊 (Home View)
           -------------------------- */
        #home-view { 
            position: relative; height: 100vh; width: 100vw; 
            overflow: hidden; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            z-index: 10; 
        }
        
        .celebration-content { 
            z-index: 10; text-align: center; background: rgba(255, 255, 255, 0.9); 
            padding: 50px 70px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(0.8);
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        .celebration-content .subtitle {
            font-size: 20px; color: #d4a373; letter-spacing: 4px;
            margin-bottom: 10px; text-transform: uppercase;
        }
        .celebration-content h1 {
            font-weight: 400; font-size: 36px; margin: 0 0 15px 0; 
            letter-spacing: 2px; color: #5c4a4d;
        }
        .celebration-content p {
            font-size: 18px; color: #777; margin-bottom: 30px; letter-spacing: 1px;
        }

        .enter-btn { 
            padding: 14px 40px; font-size: 16px; cursor: pointer; 
            background: #5c4a4d; color: white; border: none; 
            border-radius: 30px; transition: all 0.3s ease;
            letter-spacing: 1px; box-shadow: 0 4px 15px rgba(92, 74, 77, 0.3);
        }
        .enter-btn:hover {
            background: #4a3b3d; transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(92, 74, 77, 0.4);
        }

        .confetti {
            position: absolute; top: -10px; width: 10px; height: 10px;
            background-color: #f2d74e; opacity: 0; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { opacity: 1; top: -10px; transform: translateX(0) rotate(0deg); }
            100% { opacity: 1; top: 100vh; transform: translateX(100px) rotate(720deg); }
        }

        /* --------------------------
           相簿網格與輪播區塊 (Gallery View)
           -------------------------- */
        #gallery-view { 
            display: none; padding: 40px 20px; text-align: center; 
            animation: fadeIn 0.8s ease forwards; background: transparent; 
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 輪播圖容器 */
        #gallery-carousel {
            position: relative; width: 100%; max-width: 1200px;
            aspect-ratio: 3 / 2; max-height: 80vh; 
            margin: 0 auto 50px auto; border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background-color: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px); 
        }
        
        /* 更新：輪播圖幻燈片排版 (支援單張與雙張並排) */
        .carousel-slide { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; gap: 10px;
            padding: 10px; box-sizing: border-box; /* 讓照片與邊緣保留一點呼吸空間 */
            opacity: 0; transition: opacity 1.2s ease-in-out; z-index: 0; 
        }
        .carousel-slide.active { opacity: 1; z-index: 1; }
        
        /* 單張橫式照片滿版、不裁切 */
        .carousel-slide img { 
            height: 100%; width: 100%; object-fit: contain; 
        }
        /* 直式雙拼照片各佔一半寬度、不裁切 */
        .carousel-slide.dual-portrait img {
            width: calc(50% - 5px);
        }

        #gallery-view h2 {
            font-weight: 300; color: #5c4a4d; margin-bottom: 30px; letter-spacing: 2px;
        }
        
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 15px; max-width: 1200px; margin: 0 auto; 
        }
        .gallery img { 
            width: 100%; aspect-ratio: 1; object-fit: cover; 
            border-radius: 8px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; 
            background: white; padding: 4px; box-sizing: border-box; 
        }
        .gallery img:hover { 
            transform: scale(1.03); box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        /* --------------------------
           燈箱區塊與底部縮圖 (Lightbox)
           -------------------------- */
        #lightbox { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.95); 
            z-index: 1000; flex-direction: column; justify-content: space-between; align-items: center; 
        }
        #lightbox.active { display: flex; }
        .close-btn { 
            position: absolute; top: 15px; right: 25px; color: white; font-size: 40px; cursor: pointer; z-index: 1001; 
        }
        .lightbox-main { 
            flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; padding: 20px; box-sizing: border-box;
        }
        #lightbox-img { 
            max-width: 100%; max-height: 80vh; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .lightbox-thumbnails { 
            display: flex; overflow-x: auto; width: 100%; padding: 15px 10px; background: rgba(20,20,20,0.8); gap: 10px; box-sizing: border-box; align-items: center; height: 120px; 
        }
        .lightbox-thumbnails img { 
            height: 80px; min-width: 80px; object-fit: cover; cursor: pointer; opacity: 0.4; transition: opacity 0.3s, border 0.3s; border-radius: 6px; border: 2px solid transparent; 
        }
        .lightbox-thumbnails img.active { opacity: 1; border-color: #fff; }
        .lightbox-thumbnails::-webkit-scrollbar { height: 8px; }
        .lightbox-thumbnails::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .lightbox-thumbnails::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }

        /* 回到頂部按鈕 */
        #backToTopBtn {
            display: none; position: fixed; bottom: 30px; right: 30px; z-index: 900; font-size: 24px; border: none; background-color: #5c4a4d; color: white; cursor: pointer; padding: 12px 18px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background-color 0.3s, transform 0.3s; 
        }
        #backToTopBtn:hover { background-color: #4a3b3d; transform: translateY(-3px); }
        
        /* --------------------------
           行動裝置專屬優化 (Media Query)
           -------------------------- */
        @media (max-width: 768px) {
            #gallery-carousel { aspect-ratio: 4 / 3; margin-bottom: 30px; }
            #gallery-view { padding: 20px 10px; }
            
            .gallery { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 5px; 
            }
            .gallery img {
                padding: 2px; border-radius: 4px; 
            }
            
            .celebration-content { padding: 40px 30px; }
            .celebration-content h1 { font-size: 28px; }
            .celebration-content p { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="bg-decoration dec-1"></div>
    <div class="bg-decoration dec-2"></div>

    <div id="home-view">
        <div class="celebration-content">
            <div class="subtitle">Just Married</div>
            <h1>世郡 & 禾昀</h1>
            <p>感謝您的參與，與我們分享這份喜悅！</p>
            <button class="enter-btn" onclick="enterAlbum()">翻開相簿</button>
        </div>
    </div>

    <div id="gallery-view">
        <!-- 輪播圖 -->
        <div id="gallery-carousel"></div>
        <h2>所有照片</h2>
        <div class="gallery" id="gallery"></div>
    </div>

    <div id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-main">
            <img id="lightbox-img" src="" alt="Enlarged photo">
        </div>
        <div class="lightbox-thumbnails" id="lightbox-thumbnails"></div>
    </div>

    <button id="backToTopBtn" onclick="scrollToTop()" title="回到最上方">↑</button>

    <script>
        // --- 產生慶祝彩帶 ---
        const homeView = document.getElementById('home-view');
        const colors = ['#d4a373', '#e9c46a', '#f4a261', '#e76f51', '#2a9d8f', '#a8dadc', '#ffb5a7'];
        for (let i = 0; i < 70; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = Math.random() * 8 + 5 + 'px';
            confetti.style.height = confetti.style.width;
            confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
            confetti.style.animationDelay = Math.random() * 5 + 's';
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            homeView.appendChild(confetti);
        }

        // --- 圖片產生與分組邏輯 ---
        const totalPhotos = 30; 
        const galleryCarousel = document.getElementById('gallery-carousel');
        const gallery = document.getElementById('gallery');
        const lightboxThumbnails = document.getElementById('lightbox-thumbnails');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightbox = document.getElementById('lightbox');
        
        const imagePromises = [];

        for (let i = 1; i <= totalPhotos; i++) {
            const src = `images/photo${i}.jpg`; 
            
            // 1. 快速產生下方相簿網格與縮圖
            const galleryImg = document.createElement('img');
            galleryImg.src = src;
            galleryImg.loading = "lazy";
            galleryImg.onclick = () => openLightbox(i);
            gallery.appendChild(galleryImg);
            
            const thumbImg = document.createElement('img');
            thumbImg.src = src;
            thumbImg.loading = "lazy";
            thumbImg.id = `thumb-${i}`;
            thumbImg.onclick = () => showInLightbox(i);
            lightboxThumbnails.appendChild(thumbImg);

            // 2. 利用 Promise 非同步檢查圖片尺寸方向
            const promise = new Promise((resolve) => {
                const imgObj = new Image();
                imgObj.onload = function() {
                    resolve({ src: src, isLandscape: this.naturalWidth > this.naturalHeight });
                };
                imgObj.onerror = function() {
                    resolve(null); // 若檔案缺失不中斷程式
                };
                imgObj.src = src;
            });
            imagePromises.push(promise);
        }
        
        // 等待所有照片尺寸檢查完畢後，再處理輪播圖排版
        Promise.all(imagePromises).then((results) => {
            const landscapes = [];
            const portraits = [];

            // 分類橫式與直式照片
            results.forEach(res => {
                if (res) {
                    if (res.isLandscape) landscapes.push(res.src);
                    else portraits.push(res.src);
                }
            });

            const slidesElements = [];

            // 處理橫式照片 (單張)
            landscapes.forEach(src => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                const img = document.createElement('img');
                img.src = src;
                slide.appendChild(img);
                galleryCarousel.appendChild(slide);
                slidesElements.push(slide);
            });

            // 處理直式照片 (兩張併為一組)
            for (let i = 0; i < portraits.length; i += 2) {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide dual-portrait';

                const img1 = document.createElement('img');
                img1.src = portraits[i];
                slide.appendChild(img1);

                // 如果還有下一張直式照片，就併在一起
                if (i + 1 < portraits.length) {
                    const img2 = document.createElement('img');
                    img2.src = portraits[i + 1];
                    slide.appendChild(img2);
                }
                
                galleryCarousel.appendChild(slide);
                slidesElements.push(slide);
            }

            // --- 開始執行隨機輪播 ---
            if (slidesElements.length > 0) {
                // 網頁載入時，第一張顯示的照片也「隨機抽籤」決定
                let currentCarouselIndex = Math.floor(Math.random() * slidesElements.length);
                slidesElements[currentCarouselIndex].classList.add('active');

                // 設定計時器，每 4 秒切換到下一張隨機照片
                setInterval(() => {
                    if (slidesElements.length > 1) {
                        slidesElements.forEach(slide => slide.classList.remove('active'));
                        
                        let nextIndex;
                        do {
                            nextIndex = Math.floor(Math.random() * slidesElements.length);
                        } while (nextIndex === currentCarouselIndex); // 確保不會抽到重複的
                        
                        currentCarouselIndex = nextIndex;
                        slidesElements[currentCarouselIndex].classList.add('active');
                    }
                }, 4000);
            }
        });
        
        // --- 頁面切換 ---
        function enterAlbum() {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('gallery-view').style.display = 'block';
            window.scrollTo(0, 0); 
        }
        
        // --- 燈箱控制 ---
        function openLightbox(index) {
            lightbox.classList.add('active');
            showInLightbox(index);
        }
        function closeLightbox() {
            lightbox.classList.remove('active');
        }
        
        document.querySelector('.lightbox-main').addEventListener('click', function(e) {
            if (e.target !== lightboxImg) closeLightbox();
        });

        function showInLightbox(index) {
            lightboxImg.src = `images/photo${index}.jpg`;
            const thumbs = document.querySelectorAll('.lightbox-thumbnails img');
            thumbs.forEach(t => t.classList.remove('active'));
            const activeThumb = document.getElementById(`thumb-${index}`);
            activeThumb.classList.add('active');
            activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        // --- 回到頂部按鈕 ---
        const backToTopBtn = document.getElementById("backToTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                backToTopBtn.style.display = "block";
            } else {
                backToTopBtn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }
    </script>
</body>
</html>
